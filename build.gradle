plugins {
    id 'java'
}

group = 'com.gaukh'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files(project.property('hytale_server_jar'))
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
}

// Server läuft im Projekt unter /run
def serverDir = file("${projectDir}/run")
def modsDir = file("${serverDir}/mods")

tasks.register('setupServer') {
    doLast {
        modsDir.mkdirs()

        def serverJar = file("${serverDir}/HytaleServer.jar")
        def assetsZip = file("${serverDir}/Assets.zip")

        if (!serverJar.exists()) {
            copy {
                from project.property('hytale_server_jar')
                into serverDir
            }
        }
        if (!assetsZip.exists()) {
            copy {
                from project.property('hytale_assets_zip')
                into serverDir
            }
        }
    }
}

tasks.register('copyPlugin', Copy) {
    dependsOn build, setupServer
    from "build/libs/${project.name}-${version}.jar"
    into modsDir
}

// Extrahiert das Asset-Pack aus der JAR
tasks.register('extractAssets') {
    dependsOn copyPlugin
    doLast {
        def assetPackDir = file("${modsDir}/${project.name}")
        assetPackDir.mkdirs()

        // Extrahiere manifest.json, Server/ und Common/ (UI) aus der JAR
        copy {
            from zipTree("${modsDir}/${project.name}-${version}.jar")
            into assetPackDir
            include 'manifest.json'
            include 'Server/**'
            include 'Common/**'
        }

        // Passe manifest.json an (anderer Name als Plugin)
        def manifestFile = file("${assetPackDir}/manifest.json")
        if (manifestFile.exists()) {
            manifestFile.text = """{
  "Group": "${project.group}",
  "Name": "${project.name}Assets",
  "Version": "${version}"
}
"""
        }
    }
}

tasks.register('runServer', Exec) {
    dependsOn extractAssets
    workingDir serverDir
    commandLine 'java', '-jar', 'HytaleServer.jar', '--assets', 'Assets.zip', '--disable-sentry'
    standardInput = System.in
}
